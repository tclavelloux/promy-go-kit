name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/go-lint.yml@go-lint/v1
    with:
      workflow-sync: true

  vuln:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/go-vuln.yml@go-vuln/v1

  # Replaces the old `build:` job. `go test ./...` already compiles every
  # package and govet runs by default in golangci-lint v2, so `build:` was
  # duplicate signal. This gate also pins the Dockerfile's Go version against
  # go.mod -- drift `build:` could never see, since it resolved its toolchain
  # from go.mod itself.
  docker:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/go-docker.yml@go-docker/v1

  test:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/go-test.yml@go-test/v1
    with:
      timeout-minutes: 6

  # When scaffolding a new service from this template, set .testcoverage.yml's
  # `threshold.total` to the achieved coverage of the seeded tests.
  coverage:
    if: github.event.pull_request.draft == false
    needs: test
    permissions:
      contents: read
      pull-requests: write
    uses: tclavelloux/promy-github-workflows/.github/workflows/go-coverage.yml@go-coverage/v2
    secrets: inherit

  gitleaks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # gitleaks-action@v2 reads GET /repos/{repo}/pulls/{n}/commits to scope the
    # scan to the PR's commit range, so it needs pull-requests: read. It posts
    # nothing, so read is enough -- write is not.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # List EVERY other job in `needs:`. The in-workflow check-run verification is
  # the backstop, not the primary gate.
  automerge:
    needs: [lint, vuln, docker, test, coverage, gitleaks]
    # No status function here, so GitHub implicitly ANDs success(): any failed,
    # cancelled or skipped need skips this job.
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'promy-fleet-bot[bot]'
    # Must match the reusable workflow's permissions exactly; it can only narrow.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
      statuses: read
    uses: tclavelloux/promy-github-workflows/.github/workflows/dependabot-automerge.yml@dependabot-automerge/v1
